    <title>高数闯关 · 同济第八版上册</title>
    <script>
      // 尽早捕获安装事件，避免 React 挂载前事件已经触发而丢失。
      window.__pwaInstallPrompt = null;
      window.addEventListener('beforeinstallprompt', function (event) {
        event.preventDefault();
        window.__pwaInstallPrompt = event;
        window.dispatchEvent(new Event('pwa-install-ready'));
      });
    </script>
  </head>
  <body>
    <div id="root">
      <div
        style="
          min-height: 100vh;
          display: flex;
          align-items: center;
          justify-content: center;
          padding: 24px;
          background: #f4f0e6;
          color: #6b6255;
          font-family: Georgia, 'Songti SC', serif;
          font-size: 14px;
          line-height: 1.8;
          text-align: center;
        "
      >
        正在加载高数闯关…如果长时间停在这里，请检查网络后刷新页面。
      </div>
    </div>
    <noscript>请启用 JavaScript 后再使用高数闯关。</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
